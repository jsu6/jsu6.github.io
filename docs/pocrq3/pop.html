<!doctype html><meta charset="utf-8"><body><script>
addEventListener('message', (m) => {
  if (m.data !== 'go') return;
  addEventListener('popstate', (e) => parent.postMessage({pop: true, trusted: e.isTrusted,
    v: e.hasUAVisualTransition}, '*'), {once: true});
  history.pushState({s: 1}, '', '?pushed');
  setTimeout(() => history.back(), 50);
});
</script></body>
